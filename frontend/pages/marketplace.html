<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | ARASHI v3.0</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <main class="content" style="margin-left: 0; width: 100%; padding: 30px; max-width: 1200px; margin: 0 auto;">
        
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <a href="../index.html" class="see-all">← Retour à l'accueil</a>
                <h1 style="color: var(--primary-color); margin-top: 10px;">🛒 Marketplace Officiel ARASHI</h1>
            </div>
            <button class="btn btn-warning" onclick="history.back()">Retour</button>
        </header>

        <!-- Recherche et Filtres -->
        <section class="search-container" style="margin: 0 0 30px 0;">
            <div class="search-box">
                <input type="text" id="searchListing" placeholder="Rechercher une villa, un matériau, un service topographique...">
            </div>
        </section>

        <!-- Grille Principale des Produits -->
        <section class="products-grid" id="fullMarketplaceGrid">
            <div class="product-card-placeholder">Chargement du catalogue Supabase...</div>
        </section>

    </main>

    <script type="module">
        import { loadMarketplaceListings } from '../js/marketplace.js';
        document.addEventListener('DOMContentLoaded', () => {
            loadMarketplaceListings('fullMarketplaceGrid');
        });
    </script>
</body>
</html>
