<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immobilier | Entreprise ARASHI v3.0</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>

    <button id="menuToggle" class="menu-toggle">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <h2>ARASHI</h2>
            <p>Immobilier</p>
        </div>

        <nav class="sidebar-nav" style="padding: 15px; background: #0f172a; color: white;">
            <a href="../index.html" data-lang="home" style="display: block; padding: 10px; color: white; text-decoration: none;">🏠 Accueil</a>
            <a href="dashboard.html" data-lang="dashboard" style="display: block; padding: 10px; color: white; text-decoration: none;">📊 Dashboard</a>
            <a href="immobilier.html" class="active" data-lang="realestate" style="display: block; padding: 10px; color: white; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.1); border-radius: 6px;">🏡 Immobilier</a>
            <a href="parcelles.html" data-lang="plots" style="display: block; padding: 10px; color: white; text-decoration: none;">📍 Parcelles</a>
            <a href="marketplace.html" data-lang="marketplace" style="display: block; padding: 10px; color: white; text-decoration: none;">🛒 Marketplace</a>
            <a href="vendor.html" data-lang="vendor" style="display: block; padding: 10px; color: white; text-decoration: none;">🛍️ Vendor Center</a>
            <a href="paiement.html" data-lang="payment" style="display: block; padding: 10px; color: white; text-decoration: none;">💳 Paiement Pi</a>
            <a href="admin.html" data-lang="admin" style="display: block; padding: 10px; color: white; text-decoration: none;">👑 Admin</a>

            <div class="lang-selector" style="padding: 12px 10px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); background: #1e293b; border-radius: 6px;">
                <label for="sidebarLanguageSelect" style="font-size: 0.85em; color: #94a3b8; display: block; margin-bottom: 6px;">🌐 Langue / Yare / اللغة</label>
                <select id="sidebarLanguageSelect" onchange="changeLanguage(this.value)" style="width: 100%; padding: 8px; border-radius: 5px; background: #0f172a; color: white; border: 1px solid #334e68; cursor: pointer; font-size: 0.9em;">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ha">🇳🇬 Haoussa (Hausa)</option>
                    <option value="ar">🇸🇦 Arabe (العربية)</option>
                </select>
            </div>
        </nav>
    </aside>

    <div class="content">

        <header class="topbar">
            <h1 data-lang="realestate">🏡 Immobilier ARASHI</h1>
            <div class="auth-area">
                <button id="piLogin" class="btn btn-primary" data-lang="login_pi">🪙 Connexion Pi</button>
                <span id="userStatus" style="margin-left:15px;font-weight:bold;" data-lang="not_connected">Non connecté</span>
                <button id="logoutBtn" class="btn btn-danger" style="margin-left:10px; display:none;" data-lang="logout">Déconnexion</button>
            </div>
        </header>

        <section class="search-container">
            <div class="search-box">
                <input type="search" id="propertySearch" data-lang="search" placeholder="🔎 Rechercher des villas, duplex, appartements...">
            </div>
        </section>

        <!-- GRILLE DES PROPRIÉTÉS -->
        <section class="properties-section" style="padding: 20px;">
            <div class="products-grid" id="villasContainer">
                
                <!-- Exemple de carte Villa -->
                <div class="service-card" style="background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <img src="https://zupsptrtesedlqazayzw.supabase.co/storage/v1/object/public/arashi-assets/villas/villa-moderne.jpg" alt="Villa VIP" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px;">
                    <h3 style="margin-top: 12px; font-size: 1.2rem;">Villa Haute Standing Niamey</h3>
                    <p style="color: #64748b; font-size: 0.9rem;">5 Chambres • 4 Douches • Piscine • Garage</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                        <span style="font-size: 1.4rem; font-weight: bold; color: var(--secondary-color, #f4b400);">3.5 π</span>
                        <button class="btn btn-primary" onclick="initiatePropertyPayment('Villa Haute Standing Niamey', 3.5)">Acheter / Réserver</button>
                    </div>
                </div>

            </div>
        </section>

        <footer>
            <p>© 2026 Entreprise ARASHI v3.0 - Tous droits réservés.</p>
        </footer>

    </div>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/lang.js"></script>
    <script>
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>

</html>
