<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARASHI v3.0 - Boutique Pi Network</title>
    <!-- Vos styles CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SDK Pi Network obligatoire -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>

    <!-- En-tête de votre site -->
    <header>
        <h1>ARASHI v3.0</h1>
        <div id="user-info">
            <!-- Le statut de connexion s'affichera ici -->
            <button id="login-btn" class="btn">Se connecter avec Pi</button>
        </div>
    </header>

    <!-- Corps de la page / Liste des produits -->
    <main>
        <h2>Nos offres disponibles</h2>
        
        <div class="products-container">
            <!-- EXEMPLE DE CARTE PRODUIT -->
            <div class="product-card" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 300px;">
                <h3>Villa Moderne Niamey</h3>
                <p>Superbe villa avec 5 chambres et piscine.</p>
                <p><strong>Prix : 2 Pi (π)</strong></p>
                
                <!-- C'est ici que se trouve le bouton d'achat "buy" -->
                <!-- Il appelle directement la fonction globale createPiPayment -->
                <button class="btn btn-primary" onclick="createPiPayment(2, 'Achat Villa Moderne Niamey', 'villa_001')">
                    Acheter avec Pi
                </button>
            </div>
        </div>
    </main>

    <!-- Scripts JavaScript du projet -->
    <!-- On charge d'abord le fichier de paiement qui crée la fonction globalement -->
    <script src="js/pi-payments.js"></script>
    
    <!-- On charge ensuite le fichier principal de l'application -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
